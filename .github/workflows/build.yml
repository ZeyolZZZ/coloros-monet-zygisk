name: build-monet-zygisk

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: 安装 NDK
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq cmake ninja-build unzip
          NDK_VER=r27c
          curl -sL "https://dl.google.com/android/repository/android-ndk-${NDK_VER}-linux.zip" -o /tmp/ndk.zip
          unzip -q /tmp/ndk.zip -d /opt
          echo "NDK=/opt/android-ndk-${NDK_VER}" >> $GITHUB_ENV

      - name: 编译 Zygisk 模块
        run: |
          cd zygisk-src
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release
            -DCMAKE_TOOLCHAIN_FILE=$NDK/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-34 \
            -GNinja
          cmake --build build
          ls -lh build/*.so

      - name: 组装模块
        run: |
          mkdir -p out/zygisk
          cp zygisk-src/build/arm64-v8a.so out/zygisk/
          cp module/module.prop module/*.sh out/
          chmod 755 out/*.sh
          cd out && zip -q -r ../coloros_monet_zygisk.zip . && cd ..
          ls -lh coloros_monet_zygisk.zip

      - uses: actions/upload-artifact@v4
        with:
          name: monet-zygisk-module
          path: coloros_monet_zygisk.zip
